[versions]
agp = "9.1.0"
kotlin = "2.3.20"
ksp = "2.3.6"  # or the latest 2.3.x KSP version availableroom = "2.8.4"
room = "2.8.4"
coil = "2.7.0"
vico = "3.1.0"

coreKtx = "1.18.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.03.01"
navigationCompose = "2.9.7"
lifecycleViewmodelCompose = "2.10.0"
firebaseAuth = "24.0.1"
firebaseFirestore = "26.1.2"
junit = "4.13.2"
junitAndroid = "1.3.0"
espresso = "3.7.0"
foundation = "1.10.6"
firebaseStorageKtx = "22.0.1"
room3Runtime = "3.0.0-alpha04"
sqliteKtx = "2.6.2"

[libraries]
androidx-core-ktx                  = { group = "androidx.core",             name = "core-ktx",                       version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx     = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",          version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose          = { group = "androidx.activity",         name = "activity-compose",               version.ref = "activityCompose" }
androidx-compose-bom               = { group = "androidx.compose",          name = "compose-bom",                    version.ref = "composeBom" }
androidx-compose-ui                = { group = "androidx.compose.ui",       name = "ui" }
androidx-compose-ui-graphics       = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-compose-ui-tooling-preview= { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
androidx-compose-material3         = { group = "androidx.compose.material3",name = "material3" }
androidx-compose-ui-test-junit4    = { group = "androidx.compose.ui",       name = "ui-test-junit4" }
androidx-compose-ui-tooling        = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-compose-ui-test-manifest  = { group = "androidx.compose.ui",       name = "ui-test-manifest" }
androidx-navigation-compose        = { group = "androidx.navigation",        name = "navigation-compose",             version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-ktx   = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-ktx",        version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose={ group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",    version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",      version.ref = "lifecycleViewmodelCompose" }
androidx-ui                        = { group = "androidx.compose.ui",       name = "ui" }

# Room
room-runtime   = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx       = { group = "androidx.room", name = "room-ktx",     version.ref = "room" }
room-compiler  = { group = "androidx.room", name = "room-compiler", version.ref = "room" }   # KSP processor

# Firebase
firebase-auth      = { group = "com.google.firebase", name = "firebase-auth",      version.ref = "firebaseAuth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore", version.ref = "firebaseFirestore" }

# Coil
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Vico charts
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# Test
junit              = { group = "junit",               name = "junit",              version.ref = "junit" }
androidx-junit     = { group = "androidx.test.ext",   name = "junit",              version.ref = "junitAndroid" }
androidx-espresso  = { group = "androidx.test.espresso", name = "espresso-core",   version.ref = "espresso" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }
firebase-storage-ktx = { group = "com.google.firebase", name = "firebase-storage-ktx", version.ref = "firebaseStorageKtx" }
androidx-room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3Runtime" }
androidx-sqlite-ktx = { group = "androidx.sqlite", name = "sqlite-ktx", version.ref = "sqliteKtx" }

[plugins]
android-application    = { id = "com.android.application",          version.ref = "agp" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-gms-google-services = { id = "com.google.gms.google-services", version = "4.4.4" }